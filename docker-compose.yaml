services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    working_dir: /app
    ports:
      - "${DOCKER_APP_PORT}:80"
    volumes:
      - ".:/app"
    networks:
      - absence_network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:80/up || exit 1" ]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  absence_network:
    external: true
    name: ${NETWORK_NAME:-laundry_foundation_network}
